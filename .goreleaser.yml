---
project_name: solar-battery-tester

version: 2

release:
  github:
    owner: TheCacophonyProject
    name: solar-battery-tester-code
  name_template: '{{.Tag}}'
builds:
  - goos:
      - linux
    goarch:
      - arm64
    goarm:
      - "7"
    main: ./cmd/solar-battery-tester
    ldflags: -s -w -X main.version={{.Version}}
    binary: solar-battery-tester

nfpms:
  - vendor: The Cacophony Project
    homepage: http://cacophony.org.nz/
    maintainer: Cacophony Developers <coredev@cacophony.org.nz>
    description: Solar battery pack tester for the Cacophony Project
    license: GPL v3.0
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
    bindir: /usr/bin
    contents:
      - src: _release/solar-battery-tester.service
        dst: /etc/systemd/system/solar-battery-tester.service
    scripts:
      postinstall: "_release/postinstall.sh"
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
dist: dist
