# Reverse proxy + Basic Auth in front of the gunicorn service on 127.0.0.1:8000.
#
# This is the config BEFORE certbot has run. `certbot --nginx` will rewrite
# this file in place to add the SSL block and the HTTP->HTTPS redirect --
# see DEPLOY.md. Replace battery.example.com with your actual domain first.

server {
    listen 80;
    listen [::]:80;
    server_name battery.example.com;

    # Match webapp.py's MAX_CONTENT_LENGTH (100 MB) -- nginx's default (1 MB)
    # would otherwise reject run zips with a 413 before Flask ever sees them.
    client_max_body_size 100M;

    auth_basic "Battery run summary";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Plot generation for a large zip can take a while; keep in step
        # with gunicorn's --timeout so nginx doesn't cut it off first.
        proxy_read_timeout 120s;
    }
}
